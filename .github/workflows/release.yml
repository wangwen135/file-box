# 发布流水线 / Release pipeline
# 推送 V* 形式的 tag(如 V2.2.0)时触发:
#   - 在 Linux 与 Windows 各构建一个自带 JRE 的【解压即用】压缩包(jpackage 不能交叉编译)
#   - 连同 fat jar + release.tar.gz 一起发布到 GitHub Release
#
# Triggered by a V* tag (e.g. V2.2.0):
#   - builds a self-contained, extract-and-run archive on each of Linux and Windows
#     (jpackage can't cross-compile → one runner per OS)
#   - publishes them alongside the fat jar + release.tar.gz as release assets
name: Release

on:
  push:
    tags:
      - 'V*'

# 创建 Release / 上传资源需要写权限 / needs write access to create the release & upload assets
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            archive: FileBox-*.tar.gz
          - os: windows-latest
            label: windows
            archive: FileBox-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: 拉取代码 / Checkout
        uses: actions/checkout@v4

      - name: 安装 JDK 21 / Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建(含测试)/ Build with Maven
        run: mvn -B -V package

      - name: 构建原生压缩包 (Linux) / Build native archive (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: ./packaging/build-native.sh

      - name: 构建原生压缩包 (Windows) / Build native archive (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: ./packaging/build-native.ps1

      - name: 上传原生压缩包 / Upload native archive
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.label }}
          path: target/native/${{ matrix.archive }}

      - name: 上传 jar + release.tar.gz(仅 Linux)/ Upload jar + release tarball (linux only)
        if: matrix.label == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: jar-release
          path: |
            target/file-box-*.jar
            target/file-box-*-release.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码 / Checkout
        uses: actions/checkout@v4

      - name: 安装 JDK 21(读取版本)/ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 校验版本与发布说明 / Validate version and release notes
        id: ver
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG_VERSION="${GITHUB_REF_NAME#V}"
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pom.xml=$VERSION, tag=$GITHUB_REF_NAME"
            exit 1
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Missing or empty release notes: $NOTES_FILE"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display=v$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: 汇集产物 / Gather artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: 查看 staging / List staged artifacts
        run: find staging -type f -not -name '*.jar.gz*' | sort

      - name: 创建 Release 并上传产物 / Create release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: File Box ${{ steps.ver.outputs.display }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            staging/jar-release/file-box-*.jar
            staging/jar-release/file-box-*-release.tar.gz
            staging/native-linux/FileBox-*-linux.tar.gz
            staging/native-windows/FileBox-*-windows.zip
