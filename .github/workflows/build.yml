# 手动构建 / Manual build
# 随时手动触发(workflow_dispatch):对任意分支出原生压缩包 + 启动冒烟 + 上传 artifact。
# 不发 Release、不验证版本、不需要 tag —— 正式发版走 release.yml。
#
# Manually triggered (workflow_dispatch): builds the native archives for a branch,
# smoke-tests that each one boots, and uploads them as workflow artifacts. No release,
# no version check, no tag — use release.yml for actual releases.
name: Build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            archive: FileBox-*.tar.gz
          - os: windows-latest
            label: windows
            archive: FileBox-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: 拉取代码 / Checkout
        uses: actions/checkout@v4

      - name: 安装 JDK 21 / Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建(含测试)/ Build with Maven
        run: mvn -B -V package

      - name: 构建原生压缩包 (Linux) / Build native archive (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: ./packaging/build-native.sh

      - name: 构建原生压缩包 (Windows) / Build native archive (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: ./packaging/build-native.ps1

      # 启动刚打好的包,curl 本地端口确认能起来;失败也照常上传 artifact 供人工排查
      # Boot the freshly built package and curl localhost to confirm it serves.
      # upload-artifact below uses if: always() so artifacts survive even a smoke failure.
      - name: 启动冒烟 / Boot smoke (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          set -o pipefail
          DIR=$(ls -d target/native/FileBox-*-linux | head -1)
          echo "launching $DIR/bin/FileBox"
          "$DIR/bin/FileBox" --server.port=8888 >/tmp/fbx-smoke.log 2>&1 &
          PID=$!
          root=""; admin=""
          for i in $(seq 1 45); do
            root=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8888/ || true)
            [ "$root" = "200" ] && break
            sleep 1
          done
          admin=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8888/api/admin/users || true)
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "GET /                -> ${root:-none} (want 200)"
          echo "GET /api/admin/users -> ${admin:-none} (want 401)"
          [ "$root" = "200" ] || { echo "SMOKE FAIL: app did not return 200"; tail -20 /tmp/fbx-smoke.log; exit 1; }
          [ "$admin" = "401" ] || { echo "SMOKE FAIL: admin API not gated"; exit 1; }

      - name: 启动冒烟 / Boot smoke (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          $dir = (Get-ChildItem -Directory 'target\native\FileBox-*-windows' | Select-Object -First 1).FullName
          $exe = Join-Path $dir 'FileBox.exe'
          Write-Host "launching $exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--server.port=8888' -PassThru -WindowStyle Hidden
          $root = 0
          for ($i=1; $i -le 45; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest 'http://localhost:8888/' -UseBasicParsing -TimeoutSec 3
              $root = [int]$r.StatusCode
              if ($root -eq 200) { break }
            } catch { $root = 0 }
          }
          $admin = 0
          try { $admin = [int](Invoke-WebRequest 'http://localhost:8888/api/admin/users' -UseBasicParsing -TimeoutSec 3).StatusCode }
          catch { $admin = [int]$_.Exception.Response.StatusCode.value__ }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "GET /                -> $root (want 200)"
          Write-Host "GET /api/admin/users -> $admin (want 401)"
          if ($root -ne 200) { Write-Host 'SMOKE FAIL: app did not return 200'; exit 1 }
          if ($admin -ne 401) { Write-Host 'SMOKE FAIL: admin API not gated'; exit 1 }

      - name: 上传原生压缩包 / Upload native archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.label }}
          path: target/native/${{ matrix.archive }}
