server:
  port: 8888

spring:
  servlet:
    multipart:
      # 单文件 / 单请求上限（支持最大约 2GB 文件）
      # Per-file / per-request size limit (supports files up to ~2GB)
      max-file-size: 2GB
      max-request-size: 2GB
      # multipart 临时目录：必须与存储目录在同一文件系统，
      # 这样 MultipartFile.transferTo(File) 才会走 rename 而非拷贝。
      # 若日后 ./uploads 迁到独立挂载点，请把此项改到同一挂载点。
      # Temp dir for multipart; MUST be on the same filesystem as the storage dir
      # so transferTo performs a rename. If ./uploads moves to a separate mount,
      # point this at a dir on that same mount.
      location: ./runtime/multipart-tmp

filebox:
  # 版本号来自 pom.xml，由 Maven resource filtering 注入（@project.version@）
  # Version injected from pom.xml via Maven resource filtering
  version: @project.version@
  audit:
    # 传输记录 / 登录记录 的文件路径，与"保留最近 N 条"上限（保护堆内存）
    # Transfer- and login-log file paths, plus the "keep last N records" cap (protects the heap)
    transfer-log: logs/transfer-history.jsonl
    login-log: logs/login-history.jsonl
    max-records: 100000
    # 访问统计(IP/请求数/流量/桶分布):内存表上限、快照文件、保留天数
    # Access stats (IP/request/traffic/buckets): in-memory cap, snapshot file, retention days
    access-stats-snapshot: logs/access-stats.json
    access-stats-max-entries: 500000
    access-stats-retention-days: 30
